name: 双色球每期任务

on:
  schedule:
    # UTC 14:00 = 北京时间 22:00，周二/周四/周日开奖（21:15 开奖，公告约 21:40 发布）
    - cron: '0 14 * * 2,4,6'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ssb-pages
  cancel-in-progress: false

jobs:
  task:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取开奖 / 复盘 / 生成下期号码
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python jobs/run_draw.py

      - name: 提交结果
        run: |
          git config user.name "ssb-bot"
          git config user.email "ssb-bot@users.noreply.github.com"
          git add data/state.json data.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新 $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git pull --rebase --autostash origin main || true
            git push
          fi

  deploy:
    needs: task
    if: always() && (needs.task.result == 'success' || needs.task.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
