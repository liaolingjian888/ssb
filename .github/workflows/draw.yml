name: 彩票每期任务

on:
  schedule:
    # cron: 0=周日 1=周一 2=周二 3=周三 4=周四 5=周五 6=周六
    # 双色球（二/四/日 21:15）+ 大乐透（一/三/六 21:25），每天都在开奖窗口密集尝试
    # 北京时间 21:50 / 22:10 / 22:30 / 23:00 / 23:30（UTC 13:50 / 14:10 / 14:30 / 15:00 / 15:30）
    # 脚本内部还有"开奖日未出结果就等 80 秒重试"，避免因数据源延迟而空跑
    - cron: '50 13 * * 0,1,2,3,4,6'
    - cron: '10 14 * * 0,1,2,3,4,6'
    - cron: '30 14 * * 0,1,2,3,4,6'
    - cron: '0 15 * * 0,1,2,3,4,6'
    - cron: '30 15 * * 0,1,2,3,4,6'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: lottery-task
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 双色球
        continue-on-error: true
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          set -o pipefail
          python -u jobs/run_draw.py 2>&1 | tee data/last_run.log

      - name: 大乐透
        continue-on-error: true
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          set -o pipefail
          python -u jobs/run_dlt.py 2>&1 | tee data/last_run_dlt.log

      - name: 提交结果
        if: always()
        run: |
          git config user.name "lottery-bot"
          git config user.email "lottery-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新 $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
            git push
          fi
