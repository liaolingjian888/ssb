name: 双色球每期任务

on:
  schedule:
    # cron 里 0=周日 1=周一 … 6=周六。双色球周二/周四/周日开奖，所以是 0,2,4
    # UTC 14:00 = 北京 22:00；再补一次 UTC 15:30 = 北京 23:30 防止首轮抓取过早
    - cron: '0 14 * * 0,2,4'
    - cron: '30 15 * * 0,2,4'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ssb-task
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取开奖 / 复盘 / 生成下期号码
        continue-on-error: true
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          set -o pipefail
          python -u jobs/run_draw.py 2>&1 | tee data/last_run.log

      - name: 提交结果
        if: always()
        run: |
          git config user.name "ssb-bot"
          git config user.email "ssb-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新 $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi
